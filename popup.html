<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Chat Sidebar Adjuster</title></head>
<body><main>
<h1>Chat Sidebar Adjuster</h1>
<button id="phone">📱 Abrir como celular</button>
<p class="tip">WhatsApp en una ventana pequeña: lista y chat de uno en uno, con botón <b>← Volver</b>. Agranda la ventana para regresar a la vista normal.</p>
<button id="open" class="secondary">Abrir en pestaña</button>
<p class="tip">El ajuste de la lista está en el botón pequeño (burbuja + engranaje) de la barra izquierda de WhatsApp.</p>
<small>No lee, guarda ni transmite mensajes.</small>
</main><script src="popup.js"></script></body></html>
